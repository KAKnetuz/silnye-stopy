<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ECF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1521" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ежедневный комплекс ЛФК для стоп с таймером и анимированными схемами">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Сильные стопы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Martian+Mono:wght@500;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: one-screen app. Home = streak strip + four exercise blocks; workout = full-height view with exercise, round timer dial, instructions, controls pinned to the bottom. */
:root{
  --paper:#ECF0F4; --card:#FFFFFF; --ink:#15223A; --muted:#566377; --line:#D2DAE3;
  --accent:#D4470F; --accent-ink:#FFFFFF; --accent-soft:#FBE4D7;
  --calm:#2B69AD; --calm-soft:#DCE8F6;
  --ok:#2A7F3B; --ok-ink:#FFFFFF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Martian Mono",ui-monospace,"Roboto Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1521; --card:#172030; --ink:#E7ECF3; --muted:#98A4B6; --line:#2A3647;
    --accent:#FF7B38; --accent-ink:#1B0C03; --accent-soft:#3B2417;
    --calm:#74A9E8; --calm-soft:#1A2B41;
    --ok:#5FC47C; --ok-ink:#06180B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1521; --card:#172030; --ink:#E7ECF3; --muted:#98A4B6; --line:#2A3647;
  --accent:#FF7B38; --accent-ink:#1B0C03; --accent-soft:#3B2417;
  --calm:#74A9E8; --calm-soft:#1A2B41;
  --ok:#5FC47C; --ok-ink:#06180B;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}

/* ---------- Home ---------- */
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
.kicker,.sub,.eyebrow,.howto dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,9vw,44px);line-height:1.02;letter-spacing:-.01em;margin:6px 0 8px}
.meta{margin:0;color:var(--muted);font-variant-numeric:tabular-nums}

.streak{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:14px}
.streak-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stat{display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--f-num);font-weight:700;font-size:30px;line-height:1}
.stat span{color:var(--muted);font-size:14px}
.days{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-weight:600}
.day i{width:100%;max-width:18px;aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);display:block}
.day.on i{background:var(--accent);border-color:var(--accent)}
.day.today{color:var(--ink)}
.day.today i{border-color:var(--ink)}
.day.on.today i{border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;min-height:54px;padding:0 20px;font-weight:700;font-size:17px;text-align:center}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}
.cta{display:grid;gap:10px}

.opts{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.sw{display:flex;align-items:center;gap:10px;font-weight:500;cursor:pointer}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked{background:var(--accent)}
.sw input:checked::after{transform:translateX(18px)}
.note{font-size:13px;color:var(--muted);margin:-4px 0 0;flex-basis:100%}

.blk{display:grid;gap:8px}
.blk-h{display:flex;align-items:baseline;gap:10px;padding-top:10px;border-top:2px solid var(--ink);margin-top:6px}
.blk-n{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.blk-h h2{font-family:var(--f-display);font-size:18px;font-weight:700;margin:0;flex:1;min-width:0}
.blk-t{font-family:var(--f-num);font-size:12px;color:var(--muted);white-space:nowrap}
.sub{margin-top:6px}
.exl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.exr{width:100%;display:grid;grid-template-columns:24px minmax(0,1fr) 18px;gap:10px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.exr:hover{border-color:var(--muted)}
.exr-i{font-family:var(--f-num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.exr-b{min-width:0;display:grid;gap:2px}
.exr-n{font-weight:600}
.exr-d{font-size:14px;color:var(--muted)}
.exr svg{width:18px;height:18px;color:var(--muted)}

/* ---------- Workout / done overlays ---------- */
.screen{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wbar{display:flex;align-items:center;gap:4px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:6px}
.ibtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);flex:none}
.ibtn svg{width:22px;height:22px}
.wbar-t{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.25}
#w-block{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#w-count{font-family:var(--f-num);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.wprog{height:4px;background:var(--line);flex:none}
.wprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.wmain{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wcol{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:16px 24px;display:flex;flex-direction:column;gap:10px}
#w-name{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,6.6vw,30px);line-height:1.12;margin:0}
.dose{margin:0;color:var(--muted);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600;line-height:1.3}
.chip svg{width:13px;height:18px;flex:none}
.chip.more{background:var(--accent-soft);border-color:transparent}
.chip.rest{background:var(--calm-soft);border-color:transparent}

.anim{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.anim svg{display:block;width:100%;height:auto;aspect-ratio:2/1}
.anim .k{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.anim .kf{fill:none;stroke:var(--muted);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.anim .hd{fill:var(--ink)}
.anim .fl{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.anim .pr{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim .prf{fill:var(--line);stroke:var(--muted);stroke-width:1.5}
.anim .ft{fill:var(--paper);stroke:var(--ink);stroke-width:1.3;stroke-linejoin:round;stroke-linecap:round}
.anim .ftn{fill:var(--paper)}
.anim .ftd{fill:none;stroke:var(--ink);stroke-width:.9;stroke-linecap:round;opacity:.6}
.anim .gh{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2.5 2.5;opacity:.7}
.anim .sd{fill:var(--line);stroke:var(--ink);stroke-width:1.3}
.anim .sole{fill:var(--line)}
.anim .ac{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.anim .acf{fill:var(--accent)}
.anim .ball{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.anim .dsh{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:3 3}
.anim .dsa{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.anim .twl{fill:none;stroke:var(--calm);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.anim .pap{fill:var(--paper);stroke:var(--line);stroke-width:1.5}
.anim .wall{fill:var(--line)}

.dial{position:relative;width:min(58vw,30vh,230px);max-width:100%;aspect-ratio:1;margin:2px auto 0}
.dial svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.trk{fill:none;stroke:var(--line);stroke-width:10}
.arc{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .12s linear,stroke .2s}
.dial[data-p="rest"] .arc,.dial[data-p="relax"] .arc,.dial[data-p="breath"] .arc{stroke:var(--calm)}
.dial[data-p="prep"] .arc{stroke:var(--ink)}
.dial[data-p="manual"] .arc{stroke:var(--accent-soft)}
.breath{position:absolute;inset:13%;border-radius:50%;background:var(--calm-soft);transform:scale(.55)}
.dial-c{position:absolute;inset:14%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#w-big{font-family:var(--f-num);font-weight:700;font-size:clamp(38px,12.5vw,58px);line-height:1;font-variant-numeric:tabular-nums}
#w-big.txt{font-family:var(--f-display);font-weight:700;font-size:clamp(18px,5.6vw,25px);line-height:1.15;text-wrap:balance}
#w-sub{font-size:15px;font-weight:600;color:var(--muted);line-height:1.25}
.dial[data-p="hold"] #w-sub,.dial[data-p="work"] #w-sub{color:var(--accent)}
.dial[data-p="rest"] #w-sub,.dial[data-p="relax"] #w-sub,.dial[data-p="breath"] #w-sub{color:var(--calm)}
.pips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:10px}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--accent)}
.pips i.cur{box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--accent)}

.howto{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:12px;margin:6px 0 0}
.howto dd{margin:3px 0 0}
.howto .goal dd{color:var(--muted);font-size:15px}
.nextup{margin:2px 0 0;color:var(--muted);font-size:14px;text-align:center}

.wctl{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:10px 12px;border-top:1px solid var(--line);background:var(--paper);flex:none}
.side{height:56px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.side svg{width:24px;height:24px}
#w-main{min-height:56px;font-size:19px}
#w-main.is-pause{background:var(--ink);color:var(--paper)}
#w-main.is-done{background:var(--ok);color:var(--ok-ink)}

.done-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:24px}
.badge{width:96px;height:96px;border-radius:50%;background:var(--ok);color:var(--ok-ink);display:grid;place-items:center}
.badge svg{width:48px;height:48px}
.done-c h2{font-family:var(--f-display);font-size:clamp(24px,7vw,32px);margin:0;line-height:1.1}
.done-stats{display:flex;gap:28px;flex-wrap:wrap;justify-content:center}
.done-stats .stat{flex-direction:column;align-items:center;gap:4px}
.done-c .btn{min-width:220px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translate(-50%,-8px);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;z-index:40;pointer-events:none;max-width:calc(100% - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="home">
  <header class="hero">
    <p class="kicker">Ежедневная гимнастика для стоп</p>
    <h1>Сильные стопы</h1>
    <p class="meta" id="h-meta"></p>
  </header>

  <section class="streak" aria-label="Регулярность занятий">
    <div class="streak-top">
      <div class="stat"><b id="h-streak">0</b><span id="h-streak-w">дней подряд</span></div>
      <div class="stat"><span>всего занятий</span><b id="h-total" style="font-size:20px">0</b></div>
    </div>
    <div class="days" id="h-days"></div>
  </section>

  <div class="cta">
    <button class="btn btn-main" id="h-start" type="button">Начать тренировку</button>
    <button class="btn btn-ghost" id="h-resume" type="button" hidden></button>
  </div>

  <div class="opts">
    <label class="sw" for="opt-beep"><input type="checkbox" id="opt-beep" checked> Сигналы и вибрация</label>
    <label class="sw" for="opt-voice"><input type="checkbox" id="opt-voice" checked> Голосовые подсказки</label>
    <p class="note" id="voice-note" hidden>На этом устройстве нет русского голоса для подсказок — останутся звуковые сигналы.</p>
  </div>

  <div id="h-blocks" class="blk-list"></div>
</div>

<section class="screen" id="work" hidden aria-label="Тренировка">
  <header class="wbar">
    <button class="ibtn" id="w-close" type="button" aria-label="Закрыть тренировку">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="wbar-t"><span id="w-block"></span><span id="w-count"></span></div>
    <button class="ibtn" id="w-mute" type="button" aria-label="Выключить звук"></button>
  </header>
  <div class="wprog"><i id="w-prog"></i></div>
  <div class="wmain">
    <div class="wcol">
      <p class="eyebrow" id="w-group"></p>
      <h2 id="w-name"></h2>
      <p class="dose" id="w-dose"></p>
      <div class="chips" id="w-chips" aria-live="polite"></div>
      <div class="anim"><svg viewBox="0 0 240 120" id="w-anim-svg" role="img" aria-label="Схема выполнения упражнения"></svg></div>
      <div class="dial" id="w-dial" data-p="idle">
        <div class="breath" id="w-breath" hidden></div>
        <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90"/><circle class="arc" id="w-arc" cx="100" cy="100" r="90" stroke-dasharray="565.49" stroke-dashoffset="565.49"/></svg>
        <div class="dial-c"><div id="w-big"></div><div id="w-sub"></div></div>
      </div>
      <div class="pips" id="w-pips"></div>
      <dl class="howto">
        <div><dt>Исходное положение</dt><dd id="w-start"></dd></div>
        <div><dt>Как делать</dt><dd id="w-how"></dd></div>
        <div class="goal"><dt>Зачем</dt><dd id="w-goal"></dd></div>
      </dl>
      <p class="nextup" id="w-next"></p>
    </div>
  </div>
  <footer class="wctl">
    <button class="side" id="w-prev" type="button" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="btn btn-main" id="w-main" type="button">Старт</button>
    <button class="side" id="w-skip" type="button" aria-label="Дальше">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </footer>
</section>

<section class="screen" id="done" hidden aria-label="Тренировка выполнена">
  <div class="done-c">
    <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2>Тренировка выполнена</h2>
    <div class="done-stats">
      <div class="stat"><b id="d-time">0</b><span>минут</span></div>
      <div class="stat"><b id="d-streak">1</b><span id="d-streak-w">день подряд</span></div>
    </div>
    <button class="btn btn-main" id="d-home" type="button">На главную</button>
  </div>
</section>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";

/* ---------- Data ---------- */
var REST = 20; // секунд отдыха между подходами
function T(sec,o){return Object.assign({k:"time",sec:sec},o||{});}
function R(text,o){return Object.assign({k:"reps",text:text},o||{});}
function H(reps,hold,relax,o){return Object.assign({k:"hold",reps:reps,hold:hold,relax:relax},o||{});}
function BR(sec,o){return Object.assign({k:"breath",sec:sec},o||{});}
function sets(n,make,rest){
  if(rest===undefined) rest=REST;
  var out=[];
  for(var i=1;i<=n;i++){
    [].concat(make(i)).forEach(function(s){out.push(Object.assign({},s,{set:i,sets:n}));});
    if(i<n && rest) out.push({k:"rest",sec:rest});
  }
  return out;
}

var BLOCKS=[
 {n:1,name:"Разминка",ex:[
  {name:"Рисуем круги ногами",start:"Сидя на стуле, спина прямая, ноги вытянуты вперёд, пятки на полу.",how:"Носками медленно рисуй большие круги внутрь, потом наружу. Двигается только стопа, колено неподвижно.",dose:"10 кругов внутрь + 10 наружу",goal:"Подвижность голеностопного сустава, разогрев.",
   steps:[R("10 кругов внутрь"),R("10 кругов наружу")]},
  {name:"Тянем носочки — тянем на себя",short:"Тянем носочки",start:"Сидя на стуле, ноги вытянуты вперёд, пятки на полу.",how:"Потяни носки от себя, как балерина, потом на себя, чтобы пальцы смотрели в потолок.",dose:"15 раз",goal:"Разогрев мышц голени, растяжка ахиллова сухожилия.",
   steps:[R("15 раз")]},

/* ---------- Exercise animations (inline SVG, viewBox 0 0 240 120) ---------- */
var AN=(function(){
var PI=Math.PI;
function r(d){return d*PI/180;}
function dg(a){return a*180/PI;}
function dv(a){return [Math.sin(r(a)),Math.cos(r(a))];} // angle from straight down, + toward +x
function mv(p,v,l){return [p[0]+v[0]*l,p[1]+v[1]*l];}
function f1(n){return String(Math.round(n*10)/10);}
function ln(a,b,c,w){return '<line x1="'+f1(a[0])+'" y1="'+f1(a[1])+'" x2="'+f1(b[0])+'" y2="'+f1(b[1])+'" class="'+(c||"k")+'"'+(w?' stroke-width="'+w+'"':"")+'/>';}
function pl(pts,c){return '<polyline points="'+pts.map(function(p){return f1(p[0])+","+f1(p[1]);}).join(" ")+'" class="'+(c||"k")+'"/>';}
function ci(c,rr,cls){return '<circle cx="'+f1(c[0])+'" cy="'+f1(c[1])+'" r="'+f1(rr)+'" class="'+cls+'"/>';}
function ease(p){return (1-Math.cos(2*PI*p))/2;}
function sm(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t);}
function seg(p,a,b){return sm((p-a)/(b-a));}
function lerp(a,b,t){return a+(b-a)*t;}
function gl(y){return ln([0,y],[240,y],"fl");}
function arrow(a,b){
  var dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  var h1=[b[0]-ux*6-uy*4,b[1]-uy*6+ux*4],h2=[b[0]-ux*6+uy*4,b[1]-uy*6-ux*4];
  return ln(a,[b[0]-ux*3,b[1]-uy*3],"ac")+'<path d="M'+f1(b[0])+" "+f1(b[1])+"L"+f1(h1[0])+" "+f1(h1[1])+"L"+f1(h2[0])+" "+f1(h2[1])+'Z" class="acf"/>';
}
function arcA(cx,cy,R,a0,a1){
  var p0=[cx+R*Math.cos(r(a0)),cy+R*Math.sin(r(a0))],p1=[cx+R*Math.cos(r(a1)),cy+R*Math.sin(r(a1))];
  var sw=a1>a0?1:0,lg=Math.abs(a1-a0)>180?1:0;
  var t=sw?[-Math.sin(r(a1)),Math.cos(r(a1))]:[Math.sin(r(a1)),-Math.cos(r(a1))],n=[-t[1],t[0]];
  var tip=[p1[0]+t[0]*4,p1[1]+t[1]*4],b1=[p1[0]-t[0]*2+n[0]*4,p1[1]-t[1]*2+n[1]*4],b2=[p1[0]-t[0]*2-n[0]*4,p1[1]-t[1]*2-n[1]*4];
  return '<path d="M'+f1(p0[0])+" "+f1(p0[1])+"A"+R+" "+R+" 0 "+lg+" "+sw+" "+f1(p1[0])+" "+f1(p1[1])+'" class="ac"/>'+
         '<path d="M'+f1(tip[0])+" "+f1(tip[1])+"L"+f1(b1[0])+" "+f1(b1[1])+"L"+f1(b2[0])+" "+f1(b2[1])+'Z" class="acf"/>';
}
function ik(a,b,l1,l2,side){
  var dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy);
  var dd=Math.max(Math.abs(l1-l2)+0.01,Math.min(d,l1+l2-0.01));
  var ang=Math.atan2(dy,dx),A=Math.acos((l1*l1+dd*dd-l2*l2)/(2*l1*dd)),t=ang+side*A;
  var k=[a[0]+l1*Math.cos(t),a[1]+l1*Math.sin(t)],ex=b[0]-k[0],ey=b[1]-k[1],e=Math.hypot(ex,ey)||1;
  return [k,[k[0]+ex/e*l2,k[1]+ey/e*l2]];
}

/* side-view stick figure, facing right */
function legPts(hip,L){
  var knee,ank;
  if(L.to){var q=ik(hip,L.to,24,24,L.side||-1);knee=q[0];ank=q[1];}
  else{knee=mv(hip,dv(L.th),24);ank=mv(knee,dv(L.th-(L.kn||0)),24);}
  var s=dg(Math.atan2(ank[0]-knee[0],ank[1]-knee[1]));
  var f=L.fa!==undefined?L.fa:(L.flat?90:s+90+(L.an||0));
  var base=mv(ank,dv(s),2.5);
  return {knee:knee,ank:ank,heel:mv(base,dv(f),-3),toe:mv(base,dv(f),9)};
}
function armPts(sh,A){
  if(A.to){var q=ik(sh,A.to,17,15,A.side||1);return {el:q[0],hand:q[1]};}
  var el=mv(sh,dv(A.sh),17);return {el:el,hand:mv(el,dv(A.sh+(A.el||0)),15)};
}
function fig(o){
  var hip=o.hip,t=r(o.tor||0),up=[Math.sin(t),-Math.cos(t)],fs=o.far||[0,0];
  var neck=mv(hip,up,33),head=mv(hip,up,42),sh=mv(hip,up,30);
  var hipF=[hip[0]+fs[0],hip[1]+fs[1]],shF=[sh[0]+fs[0],sh[1]+fs[1]];
  var legs=o.legs.map(function(L,i){return legPts(i?hipF:hip,L);});
  var arms=(o.arms||[]).map(function(A,i){return armPts(i?shF:sh,A);});
  function dl(g,h,c){return pl([h,g.knee,g.ank],c)+ln(g.heel,g.toe,c);}
  function da(g,h,c){return pl([h,g.el,g.hand],c);}
  var s="";
  if(arms[1])s+=da(arms[1],shF,"kf");
  if(legs[1])s+=dl(legs[1],hipF,"kf");
  s+=ln(hip,neck)+ci(head,7.5,"hd")+dl(legs[0],hip,"k");
  if(arms[0])s+=da(arms[0],sh,"k");
  return {svg:s,legs:legs,arms:arms,head:head,sh:sh,hip:hip};
}
function grounded(build,fy){
  var g=build(0),m=-1e9;
  g.legs.forEach(function(L){m=Math.max(m,L.heel[1],L.toe[1]);});
  return build(fy-m-2.5);
}
function walk(p,o){
  var w=2*PI*p,amp=o.amp||20;
  var g=grounded(function(hy){
    var legs=[0,1].map(function(i){var ph=w+i*PI,th=amp*Math.sin(ph),c=Math.cos(ph);return {th:th,kn:(o.kn||24)*Math.max(0,c),an:o.an(th,c)};});
    return fig({hip:[118,hy],tor:o.tor||2,far:[-2,-1],legs:legs,arms:o.arms(w)});
  },110);
  var d="";for(var k=0;k<14;k++){var x=((k*20-p*60)%280+280)%280-20;d+=ln([x,114],[x+8,114],"fl");}
  return gl(110)+d+g.svg;
}
function chair(x,y){
  return '<rect x="'+(x-16)+'" y="'+y+'" width="32" height="4" rx="2" class="prf"/>'+ln([x-13,y+4],[x-13,112],"pr")+ln([x+13,y+4],[x+13,112],"pr")+ln([x-15,y+2],[x-15,y-34],"pr");
}
function seated(an,extra){
  var x=96,sy=86,hip=[x+2,sy-3];
  var g=fig({hip:hip,tor:-2,far:[-3,-1],legs:[{th:61,kn:0,an:an},{th:61,kn:0,an:an}],arms:[{to:[x+16,sy+4]},{to:[x+14,sy+4]}]});
  return chair(x,sy)+gl(112)+(extra||"")+g.svg;
}

/* front-view figure */
function figF(o){
  var hx=o.x,hy=o.y,s="",i,hips=[[hx-6,hy],[hx+6,hy]],neck=[hx,hy-34],head=[hx,hy-43],shs=[[hx-11,hy-29],[hx+11,hy-29]];
  for(i=0;i<2;i++){
    var L=o.legs[i],hp=hips[i],sd=i?1:-1,knee,ank;
    if(L.lift){var fl=24*Math.cos(r(80*L.lift));knee=[hp[0]+sd*3*L.lift,hp[1]+fl];ank=[knee[0]+sd*2,knee[1]+23];}
    else{ank=L.ank;knee=[(hp[0]+ank[0])/2+sd*1.5,(hp[1]+ank[1])/2];}
    s+=pl([hp,knee,ank],"k")+ln([ank[0]-sd*1.5,ank[1]+3],[ank[0]+sd*6,ank[1]+3],"k");
    if(L.lift>0.3)s+=ci(knee,3.4,"hd");

var SET=Object.assign({beep:true,voice:true},store.get("ss_set",{}));
var AC=null;

    if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}

function beep(f,d,v,delay){
  if(!AC||!SET.beep||S.muted)return;

    var t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();

    case "ready": beep(660,.1,.14);break;
    case "go": beep(1320,.2,.22);break;
    case "soft": beep(587,.18,.16);break;
    case "end": beep(988,.12,.2);beep(1318,.18,.2,.14);break;
    case "done": beep(784,.12,.2);beep(988,.12,.2,.13);beep(1318,.28,.22,.26);break;
  }

var ruVoice=null,voicesKnown=false;

    $("voice-note").hidden=!(voicesKnown&&!ruVoice&&SET.voice);

}
function say(t){

  }catch(e){}

/* ---------- Engine ---------- */
var S={view:"home",ex:0,st:0,phase:"idle",segs:[],si:0,segEnd:0,remain:0,startedAt:0,muted:false,lastBeep:-1,drawnKey:""};
function ex(){return EX[S.ex];}
function step(){return ex().steps[S.st];}
function prevReal(){var s=ex().steps;for(var j=S.st-1;j>=0;j--){if(s[j].k!=="rest")return s[j];}return null;}

function compile(st){
  var prev=prevReal(),segs=[];
  var prepMs=(st.side&&prev&&prev.side&&prev.side!==st.side)?5000:3000;
  if(st.k==="time"){segs.push({p:"prep",ms:prepMs},{p:"work",ms:st.sec*1000});}
  else if(st.k==="hold"){
    segs.push({p:"prep",ms:prepMs});
    for(var r=1;r<=st.reps;r++){segs.push({p:"hold",ms:st.hold*1000,rep:r});if(r<st.reps)segs.push({p:"relax",ms:st.relax*1000,rep:r});}
  }
  else if(st.k==="rest"){segs.push({p:"rest",ms:st.sec*1000});}
  else if(st.k==="breath"){segs.push({p:"breath",ms:st.sec*1000});}
  return segs;
}

function settle(){ // привести текущий шаг в состояние ожидания
  S.segs=[];S.si=0;
  S.phase=step().k==="reps"?"manual":"idle";
}

function runStep(){
  var st=step();
  if(st.k==="reps"){
    S.phase="manual";
    tone("end");
    var pre=st.sets>1?(ex().setWord||"Подход")+" "+st.set+". ":"";
    say(pre+(st.side?sideWord(st)+". ":"")+st.text);
    render();return;
  }
  S.segs=compile(st);S.si=0;S.phase="run";
  startSeg();render();
}

function startSeg(){
  var seg=S.segs[S.si],st=step();
  S.segEnd=now()+seg.ms;S.lastBeep=-1;
  switch(seg.p){
    case "prep":
      tone("ready");
      if(st.side&&prevReal()&&prevReal().side&&prevReal().side!==st.side) say("Смени ногу. "+sideWord(st));
      else if(st.side) say(sideWord(st));
      else say(st.label||"Приготовься");
      break;
    case "work": tone("go");say("Начали");break;
    case "hold": tone("go");say(String(seg.rep));break;
    case "relax": tone("soft");say("Расслабь");break;
    case "rest": tone("soft");say("Отдых");break;
    case "breath": tone("soft");say("Отдыхаем. Вдох на четыре, выдох на шесть");break;
  }
}

function tickWanted(seg,sec){
  if(seg.p==="prep")return sec<=2;
  if(seg.p==="breath")return false;
  return seg.ms>=6000;
}

function tick(){
  if(S.phase!=="run")return;
  var t=now(),guard=0;
  while(S.phase==="run"&&t>=S.segEnd&&guard++<60){endSeg();}
  if(S.phase!=="run")return;
  var seg=S.segs[S.si],sec=Math.ceil((S.segEnd-t)/1000);
  if(sec>=1&&sec<=3&&sec!==S.lastBeep){
    if(tickWanted(seg,sec))tone("tick");
    S.lastBeep=sec;
  }
  drawDial();
}

function endSeg(){
  if(S.si+1<S.segs.length){S.si++;startSeg();render();}
  else stepDone();
}

function stepDone(){
  if(S.st+1<ex().steps.length){S.st++;runStep();}
  else exDone();
}

function exDone(){
  tone("done");vibrate([180,90,180]);
  var finished=ex();
  if(S.ex+1<EX.length){
    S.ex++;S.st=0;settle();saveProgress();
    toast("«"+finished.short+"» — готово");
    say("Готово. Дальше: "+ex().short);
    render();
  }else finish();
}

function finish(){
  S.phase="idle";wake(false);
  var h=store.get("ss_hist",[]);if(h.indexOf(today())<0){h.push(today());store.set("ss_hist",h);}
  store.set("ss_progress",null);
  var mins=S.startedAt?Math.max(1,Math.round((Date.now()-S.startedAt)/60000)):0;
  $("d-time").textContent=mins;$("d-time").nextElementSibling.textContent=plural(mins,["минута","минуты","минут"]);
  var st=streak();$("d-streak").textContent=st;$("d-streak-w").textContent=plural(st,["день","дня","дней"])+" подряд";
  say("Тренировка закончена. Молодец!");
  show("done");
}

function advance(){ // перейти к следующему шагу без автозапуска
  var steps=ex().steps;
  if(S.st+1<steps.length){S.st++;while(step().k==="rest"&&S.st+1<steps.length)S.st++;}
  else if(S.ex+1<EX.length){S.ex++;S.st=0;}
  else{finish();return;}
  hush();settle();saveProgress();render();
}
function back(){
  if(S.st>0){S.st--;while(S.st>0&&step().k==="rest")S.st--;}
  else if(S.ex>0){S.ex--;S.st=0;}
  hush();settle();render();
}

function mainAction(){
  unlock();
  switch(S.phase){
    case "idle": if(!S.startedAt)S.startedAt=Date.now(); wake(true); runStep(); break;
    case "run": S.remain=S.segEnd-now(); S.phase="paused"; hush(); render(); break;
    case "paused": S.segEnd=now()+S.remain; S.phase="run"; wake(true); render(); break;
    case "manual": if(!S.startedAt)S.startedAt=Date.now(); wake(true); stepDone(); break;
  }
}
function skipAction(){
  unlock();
  if(S.phase==="run"||S.phase==="paused"){hush();stepDone();}
  else advance();
}

var CIRC=565.49;
function chip(text,cls,foot){

function setArc(frac,snap){

function drawDial(force){

  }

    d.dataset.p="manual";setArc(1,true);

    case "prep": t=st.side?sideWord(st):(st.label||"Приготовься");break;
    case "work": t=st.label||"Выполняй";break;
    case "hold": t="Держи · "+seg.rep+" из "+st.reps;break;
    case "relax": t="Расслабь · "+seg.rep+" из "+st.reps;break;
    case "rest": t="Отдых";break;

    var done=seg.p==="prep"?0:(seg.p==="hold"?seg.rep-1:seg.rep);
    pips(done,seg.p==="hold"?seg.rep-1:-1);

      bt.innerHTML='<span class="exr-i">'+e.num+'</span><span class="exr-b"><span class="exr-n"></span><span class="exr-d"></span></span>'+CHEV;
      bt.querySelector(".exr-n").textContent=e.name;bt.querySelector(".exr-d").textContent=e.dose;
      bt.addEventListener("click",function(){startFrom(e.idx);});
      li.appendChild(bt);ol.appendChild(li);
    });
    root.appendChild(s);
  });
  $("h-meta").textContent=BLOCKS.length+" блока · "+EX.length+" упражнений · ≈ "+Math.round(total/60)+" мин";
}

/* ---------- Views ---------- */
function show(v){
  S.view=v;
  $("work").hidden=v!=="work";$("done").hidden=v!=="done";
  if(v!=="work")stopAnim();
  if(v==="home"){renderHome();window.scrollTo(0,0);}
}
function saveProgress(){store.set("ss_progress",{date:today(),ex:S.ex});}
function startFrom(i){
  unlock();
  S.ex=i;S.st=0;S.startedAt=0;S.muted=false;S.animEx=-1;settle();
  show("work");render();
  var wm=document.querySelector(".wmain");if(wm)wm.scrollTop=0;
}
function closeWork(){
  S.phase="idle";hush();wake(false);
  if(S.ex>0)saveProgress();
  show("home");
}

/* ---------- Wiring ---------- */
function start(data){
  buildBlocks();
  $("opt-beep").checked=!!SET.beep;$("opt-voice").checked=!!SET.voice;
  $("opt-beep").addEventListener("change",function(e){SET.beep=e.target.checked;store.set("ss_set",SET);if(SET.beep){unlock();tone("ready");}});
  $("opt-voice").addEventListener("change",function(e){SET.voice=e.target.checked;store.set("ss_set",SET);loadVoices();if(SET.voice){primed=false;primeSpeech();say("Подсказки включены");}});
  $("h-start").addEventListener("click",function(){startFrom(0);});
  $("h-resume").addEventListener("click",function(e){startFrom(parseInt(e.currentTarget.dataset.ex,10)||0);});
  $("w-main").addEventListener("click",mainAction);
  $("w-skip").addEventListener("click",skipAction);
  $("w-prev").addEventListener("click",back);
  $("w-close").addEventListener("click",closeWork);
  $("w-mute").addEventListener("click",function(){S.muted=!S.muted;if(S.muted)hush();render();});
  $("d-home").addEventListener("click",function(){show("home");});
  document.addEventListener("keydown",function(e){
    if(S.view!=="work")return;
    if(e.code==="Space"&&e.target.tagName!=="BUTTON"){e.preventDefault();mainAction();}
    else if(e.key==="ArrowRight")skipAction();
    else if(e.key==="ArrowLeft")back();
  });
  document.addEventListener("visibilitychange",function(){
    if(document.hidden)return;
    try{if(canSpeak){window.speechSynthesis.cancel();loadVoices();}}catch(e){}
    if(S.view==="work"&&(S.phase==="run"||S.phase==="manual"))wake(true);
  });
  setInterval(tick,100);

  renderHome();
  if(data&&data.view==="work"&&typeof data.ex==="number"){
    startFrom(Math.min(Math.max(0,data.ex),EX.length-1));
    S.st=Math.min(data.st||0,ex().steps.length-1);settle();render();
  }
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {view:S.view,ex:S.ex,st:S.st};});}catch(e){}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
</script>

<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
</script>
