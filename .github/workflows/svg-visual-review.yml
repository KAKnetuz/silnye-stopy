name: SVG visual review
on:
  push:
    branches: [improve/mannequin-anatomy-v24]
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/render-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mannequin-rendered-frames
          path: visual-review/*.png
